# Dataset Configuration Registry (configs/datasets.yaml)
# Every benchmark dataset: source, path, freq, horizon(s), domain label, season length, licence.

datasets:
  # --- Stratified GIFT-Eval Subset (10 configurations spanning all 7 GIFT-Eval domains) ---
  - config: "m4_monthly/M/short"
    base_dataset: "m4_monthly"
    source: "Salesforce/GiftEval"
    hf_subdir: "m4_monthly"
    domain: "Econ/Fin"
    freq: "M"
    frequency_group: "monthly"
    term: "short"
    horizon: 18
    season_length: 12
    source_url: "https://huggingface.co/datasets/Salesforce/GiftEval"
    licence: "CC-BY-4.0 (M4 Competition / Monash Forecasting Repository)"
    retrieval_date: "2026-10-16"

