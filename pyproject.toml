[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsdomain"
version = "0.1.0"
description = "Domain-Shift and Computational-Efficiency Benchmark of Time-Series Foundation Models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0,<2.2.0",
    "pandas>=2.1.0",
    "pyarrow>=15.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.1",
    "statsforecast>=1.7.5",
    "scikit-learn>=1.4.0",
    "antropy>=0.1.6",
    "ruptures>=1.1.9",
    "arch>=7.0.0",
    "codecarbon>=2.4.0",
    "psutil>=5.9.8",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.2",
    "huggingface-hub>=0.23.0",
    "datasets>=2.19.0",
    "requests>=2.31.0",
    "lightgbm>=4.3.0",
    "optuna>=3.6.0",
    "dulwich>=0.22.0",
    "pytest>=8.0.0",
]

[project.scripts]
tsdomain = "tsdomain.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsdomain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
